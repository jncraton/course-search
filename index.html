<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title></title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="filter-items-display">
      <label>
        <input type="checkbox" id="filter-consent" />
        Show only require consent courses
      </label>
      <label>
        <input type="checkbox" id="filter-online" />
        Show only online courses
      </label>

      <form>
        <label>Choose a day:</label>
        <select id="selected-days">
          <option value="">All</option>
          <option value="M">Monday</option>
          <option value="T">Tuesday</option>
          <option value="W">Wednesday</option>
          <option value="R">Thursday</option>
          <option value="F">Friday</option>
        </select>
      </form>

      <button id="apply-button">Apply changes</button>
    </div>

    <table>
      <thead>
        <tr>
          <td>Course</td>
          <td>Days</td>
          <td>Consent</td>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <template id="course-row">
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </template>

    <script type="module" src="main.js"></script>
  </body>
</html>
