<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Courses</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="filter-items-display">
      <label>
        <input type="checkbox" id="filter-consent" />
        Show only require consent courses
      </label>
      <label>
        <input type="checkbox" id="filter-online" />
        Show only online courses
      </label>
      <label>
        <input type="checkbox" id="liberalArtsFilter" />
        Show only Liberal Arts courses
      </label>

      <!-- Filter-form where are you choosing the day of the week that applicable for you -->
      <form>
        <label>Choose a day:</label>
        <select id="selected-days">
          <option value="">All</option>
          <option value="M">Monday</option>
          <option value="T">Tuesday</option>
          <option value="W">Wednesday</option>
          <option value="R">Thursday</option>
          <option value="F">Friday</option>
        </select>
      </form>

      <!-- Button that applying selected changes -->
      <button id="apply-button">Apply filters</button>

    <label>&#9989; = Open &#10060; = Closed</label>

    <div class="controls">
      <label for="filterDepartment">Department:</label>
      <select id="filterDepartment"></select>
    </div>
    <table>
      <thead>
        <tr>
          <!-- Add column to devide the Enrolment people and other things -->
          <td>Status</td>
          <td>Department</td>
          <td>Course ID</td>
          <td>Class Name</td>
          <td>Days</td>
          <td>Consent</td>
          <td class="enroll-td">
            <a href="#" id="enrollments-button">
              Enrollments
              <span class="icon-span">
                <i class="fas fa-caret-up up-icon"></i>
                <i class="fas fa-caret-down down-icon"></i>
              </span>
            </a>
          </td>
          <td>Credit</td>
          <td>Format</td>
        </tr>

        <tr></tr>
      </thead>
      <tbody></tbody>
    </table>

    <template id="course-row">
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </template>

    <script type="module" src="main.js"></script>
  </body>
</html>
