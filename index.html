<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="FilterbyEnrol.css" />
    <title></title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <label>
      <input type="checkbox" id="filterConsent" />
      Show only courses that require consent
    </label>

    <!--! Add the class dropdown class (button) to filter student by enrollment -->
    <div class="dropdown">
      <h2>Sort by numerical numbers</h2>
      <button class="dropbtn">Select</button>
      <div class="dropdown-content">
        <a onclick="filterSelection('none')" id="notactive">No filters</a>
        <a onclick="filterSelection('max')" id="min-max">Filter by increasing</a>
        <a onclick="filterSelection('min')" id="max-min">Filter by decreasing</a>

      </div>
    </div>

    <table>
      <thead>
        <tr>
          <!-- Add column to devide the Enrolment people and other things -->
          <td>Course</td>
          <td>Consent</td>
          <td>Name</td>
          <td>Enrolments</td>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <template id="courserow">
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </template>

    <script type="module" src="main.js"></script>
  </body>
</html>
