<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Courses</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="filter-items-display">
      <!-- Filter by department -->
      <label for="filter-dept"
        >Department:
        <select id="filter-dept">
          <option value="">ALL DEPARTMENTS</option>
        </select>
      </label>

      <!-- Filter by day of the week the class is on -->
      <label for="selected-days"
        >Choose a day:
        <select id="selected-days">
          <option value="">All</option>
          <option value="M">Monday</option>
          <option value="T">Tuesday</option>
          <option value="W">Wednesday</option>
          <option value="R">Thursday</option>
          <option value="F">Friday</option>
        </select>
      </label>

      <label for="filter-consent">
        <input type="checkbox" id="filter-consent" />
        Show only require consent courses
      </label>

      <label for="filter-online">
        <input type="checkbox" id="filter-online" />
        Show only online courses
      </label>
    </div>
    <table>
      <thead>
        <tr>
          <td class="left">Department</td>
          <td class="left">Course ID</td>
          <td class="left">Class Name</td>
          <td class="left">Days</td>
          <td class="left">Consent</td>

          <!-- To make the arrow in the text for Enrollment -->
          <td class="center">
            <div class="enroll-div">
              <button id="enrollments-button">
                Enrollments
                <span class="icon-span">
                  <i class="up-icon">&#x25B2;</i>
                  <i class="down-icon">&#9660;</i>
                </span>
              </button>
            </div>
          </td>

          <!-- To make the arrow in the text for Credit H -->
          <td class="center">
            <div class="credit-div">
              <button id="credit-button">
                Credit
                <span class="icon-span">
                  <i class="up-icon">&#x25B2;</i>
                  <i class="down-icon">&#9660;</i>
                </span>
              </button>
            </div>
          </td>

          <td class="left">Format</td>
          <td class="right">Enrollment Status</td>
        </tr>

        <tr></tr>
      </thead>
      <tbody></tbody>
    </table>

    <template id="course-row">
      <tr>
        <td class="left"></td>
        <td class="left"></td>
        <td class="left"></td>
        <td class="left"></td>
        <td class="left"></td>
        <td class="center"></td>
        <td class="center"></td>
        <td class="left"></td>
        <td class="right"></td>
      </tr>
    </template>

    <script type="module" src="main.js"></script>
  </body>
</html>
